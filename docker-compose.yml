  #   image: aiogram/telegram-bot-api:latest
  #   container_name: tgmb-botapi
  #   environment:
  #     TELEGRAM_API_ID: "ваш api_id"      # с https://my.telegram.org
  #     TELEGRAM_API_HASH: "ваш api_hash"
  #   ports:
  #     - "8081:8081"
