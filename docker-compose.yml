services:
  bot:
    build: .
    container_name: tgmb-bot
    command: python run_bot.py
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./ffmpeg-bin:/app/.ffmpeg/bin
    restart: unless-stopped

  server:
    build: .
    container_name: tgmb-server
    command: python run_server.py
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Локальный Bot API сервер: поднимает лимит вложений для ботов с 50 МБ до 2 ГБ.
  # Для FLAC-подгрузки раскомментируй и в .env поставь BOT_API_URL=http://botapi:8081
