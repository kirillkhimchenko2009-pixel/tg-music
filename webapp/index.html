<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Vibe Music</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span class="logo">◈</span> Vibe Music</div>
      <div class="user" id="userbox"></div>
    </header>

    <main id="screen" class="screen"></main>

    <div id="playerbar" class="playerbar hidden">
      <div class="pb-progress">
        <span id="pb-cur">0:00</span>
        <input id="pb-range" type="range" min="0" max="1000" value="0" step="1">
        <span id="pb-len">0:00</span>
      </div>
      <div class="pb-main">
        <img id="pb-cover" src="" alt="">
        <div class="pb-meta">
          <div id="pb-title" class="pb-title">—</div>
          <div id="pb-artist" class="pb-artist">—</div>
        </div>
        <div class="pb-controls">
          <button id="pb-prev" class="pbtn small" title="Назад">⏮</button>
          <button id="pb-play" class="pbtn big" title="Плей">▶</button>
          <button id="pb-next" class="pbtn small" title="Вперёд">⏭</button>
        </div>
        <button id="pb-tg" class="pb-tg" title="Скачать в Telegram">⬇</button>
      </div>
    </div>

    <nav class="tabbar" id="tabbar">
      <button class="tab active" data-tab="home"><span class="ti">◎</span><span class="tl">Главная</span></button>
      <button class="tab" data-tab="search"><span class="ti">⌕</span><span class="tl">Поиск</span></button>
      <button class="tab" data-tab="library"><span class="ti">≡</span><span class="tl">Моя музыка</span></button>
      <button class="tab" data-tab="playlists"><span class="ti">▤</span><span class="tl">Плейлисты</span></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <audio id="audio" preload="auto"></audio>
  <script src="app.js?v=3"></script>
</body>
</html>
